name: CI — Web Admin

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_TRACKING_BASE_URL: https://api.benchos.app.br/track
        run: npm run build

      - name: Validate Docker multi-stage build
        run: docker build --tag benchos-web:ci .
